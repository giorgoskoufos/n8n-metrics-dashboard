name: CI and Deploy

# Deploying used to be the entire workflow: one curl to an Easypanel webhook on
# every push to main, with nothing in between. A syntax error in server.js
# reached production and the first sign of it was the dashboard being down.
#
# Now the deploy is a dependent job. If lint or the tests fail, the webhook is
# never called and what is running stays running.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile. Testing on a different major from the one
          # that runs in production is how a runtime difference reaches users.
          node-version: '22'
          cache: npm

      # ci, not install: the lockfile is the point of the exercise.
      - run: npm ci

      - run: npm run lint

      # The integration suite boots the real server against a temporary SQLite
      # file. It needs no Postgres and no n8n instance — that is deliberate, so
      # this job can run anywhere.
      - run: npm test

      # The committed vendor bundle is what the container serves; the Dockerfile
      # installs dependencies before copying the source, so nothing regenerates
      # it at build time. If it has drifted from package.json, the deployed
      # frontend is not the one described by the lockfile.
      - name: public/vendor is in sync with package.json
        run: |
          node src/scripts/vendorAssets.js
          if ! git diff --quiet -- public/vendor; then
            echo "::error::public/vendor is stale. Run 'node src/scripts/vendorAssets.js' and commit the result."
            git diff --stat -- public/vendor
            exit 1
          fi

  deploy:
    name: Deploy to Easypanel
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel Deployment
        run: |
          curl -fsS -X GET "${{ secrets.N8N_METRICS_DASHBOARD_EASYPANEL_DEPLOY_URL }}"
